<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Integration Virtual Lab</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
            color: var(--accent-cyan);
        }

        /* Input Controls */
        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        .limits-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-solve {
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: white;
        }

        .btn-solve:hover {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
            transform: translateY(-2px);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Output Lab Area */
        .step {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border-left: 4px solid var(--accent-purple);
            opacity: 0;
            transform: translateY(10px);
            animation: slideIn 0.5s forwards;
        }

        .step-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-purple);
            margin-bottom: 0.5rem;
        }

        .math-display {
            font-size: 1.2rem;
            overflow-x: auto;
            padding: 0.5rem 0;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Error Toast */
        #error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            display: none;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="error-toast">Invalid Input! Please check your syntax.</div>

    <header>
        <h1>Double Integration Lab</h1>
        <p>Interactive Step-by-Step Symbolic Solver</p>
    </header>

    <div class="container">
        <div class="glass-panel">
            <h2>System Configuration</h2>
            
            <div class="input-group">
                <label>Load Example Problem</label>
                <select id="example-select" onchange="loadExample()">
                    <option value="">-- Custom Problem --</option>
                    <option value="ex1">Polynomial Area (x² + y)</option>
                    <option value="ex2">Trigonometric (sin(x) * cos(y))</option>
                    <option value="ex3">Variable Limits (xy)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Function f(x, y)</label>
                <input type="text" id="func" value="x^2 + y" placeholder="e.g., x^2 + y">
            </div>

            <div class="limits-grid">
                <div class="input-group">
                    <label>Inner Lower Limit (y₁)</label>
                    <input type="text" id="y1" value="0" placeholder="e.g., 0 or x">
                </div>
                <div class="input-group">
                    <label>Inner Upper Limit (y₂)</label>
                    <input type="text" id="y2" value="2" placeholder="e.g., 2 or x^2">
                </div>
                <div class="input-group">
                    <label>Outer Lower Limit (x₁)</label>
                    <input type="text" id="x1" value="0" placeholder="e.g., 0">
                </div>
                <div class="input-group">
                    <label>Outer Upper Limit (x₂)</label>
                    <input type="text" id="x2" value="1" placeholder="e.g., 1">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-solve" onclick="solveIntegral()">Solve System</button>
                <button class="btn-reset" onclick="resetApp()">Reset</button>
            </div>
        </div>

        <div class="glass-panel">
            <h2>Step-by-Step Solution</h2>
            <div id="solution-box">
                <p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">
                    Enter a function and limits, then click "Solve System" to generate the virtual lab breakdown.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Example loader
        function loadExample() {
            const val = document.getElementById('example-select').value;
            if (val === 'ex1') setInputs('x^2 + y', '0', '2', '0', '1');
            if (val === 'ex2') setInputs('sin(x)*cos(y)', '0', 'pi/2', '0', 'pi/2');
            if (val === 'ex3') setInputs('x*y', '0', 'x', '0', '1');
        }

        function setInputs(f, y1, y2, x1, x2) {
            document.getElementById('func').value = f;
            document.getElementById('y1').value = y1;
            document.getElementById('y2').value = y2;
            document.getElementById('x1').value = x1;
            document.getElementById('x2').value = x2;
        }

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function resetApp() {
            document.getElementById('func').value = '';
            document.getElementById('y1').value = '';
            document.getElementById('y2').value = '';
            document.getElementById('x1').value = '';
            document.getElementById('x2').value = '';
            document.getElementById('example-select').value = '';
            document.getElementById('solution-box').innerHTML = `
                <p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">
                    System cleared. Ready for new input.
                </p>`;
        }

        // Render string to MathJax format inside a DOM element
        function formatMath(containerId, latexString) {
            document.getElementById(containerId).innerHTML = `$$${latexString}$$`;
        }

        function renderAllMath() {
            MathJax.typesetPromise();
        }

        // Core Integration Logic
        function solveIntegral() {
            const f = document.getElementById('func').value;
            const y1 = document.getElementById('y1').value;
            const y2 = document.getElementById('y2').value;
            const x1 = document.getElementById('x1').value;
            const x2 = document.getElementById('x2').value;

            const box = document.getElementById('solution-box');
            box.innerHTML = ''; // clear

            try {
                // Formatting initial integral
                const f_tex = nerdamer(f).toTeX();
                const y1_tex = nerdamer(y1).toTeX();
                const y2_tex = nerdamer(y2).toTeX();
                const x1_tex = nerdamer(x1).toTeX();
                const x2_tex = nerdamer(x2).toTeX();

                // SETUP
                addStep(box, 'step-setup', '1. Problem Setup', 
                    `\\int_{${x1_tex}}^{${x2_tex}} \\int_{${y1_tex}}^{${y2_tex}} (${f_tex}) \\,dy \\,dx`, 0);

                // INNER INTEGRATION
                const inner_int = nerdamer(`integrate(${f}, y)`);
                addStep(box, 'step-inner-int', '2. Inner Integration (w.r.t y)', 
                    `\\int_{${x1_tex}}^{${x2_tex}} \\left[ ${inner_int.toTeX()} \\right]_{${y1_tex}}^{${y2_tex}} \\,dx`, 0.2);

                // INNER SUBSTITUTION
                // We use expand() to simplify the expression after substituting the limits
                const inner_upper = nerdamer(inner_int.text()).sub('y', y2);
                const inner_lower = nerdamer(inner_int.text()).sub('y', y1);
                const inner_evaluated = nerdamer(`${inner_upper.text()} - (${inner_lower.text()})`).expand();
                
                addStep(box, 'step-inner-sub', '3. Substitute Inner Limits', 
                    `\\int_{${x1_tex}}^{${x2_tex}} (${inner_evaluated.toTeX()}) \\,dx`, 0.4);

                // OUTER INTEGRATION
                const outer_int = nerdamer(`integrate(${inner_evaluated.text()}, x)`);
                addStep(box, 'step-outer-int', '4. Outer Integration (w.r.t x)', 
                    `\\left[ ${outer_int.toTeX()} \\right]_{${x1_tex}}^{${x2_tex}}`, 0.6);

                // FINAL RESULT
                const outer_upper = nerdamer(outer_int.text()).sub('x', x2);
                const outer_lower = nerdamer(outer_int.text()).sub('x', x1);
                const final_ans = nerdamer(`${outer_upper.text()} - (${outer_lower.text()})`).expand();

                // Check if final answer evaluates to a number
                const numerical_ans = Number(final_ans.evaluate().text()).toFixed(4);
                let final_display = `${final_ans.toTeX()}`;
                
                // If it's purely numeric, show decimal approximation too
                if(!isNaN(numerical_ans) && final_ans.text() !== numerical_ans) {
                     final_display += ` \\approx ${numerical_ans}`;
                }

                addStep(box, 'step-final', '5. Final Answer', final_display, 0.8, true);

                renderAllMath();

            } catch (err) {
                console.error(err);
                showError("Math Error: Ensure functions and syntax are correct (e.g. use 2*x instead of 2x).");
            }
        }

        // Helper to append steps to DOM
        function addStep(container, id, title, latex, delaySec, highlight = false) {
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step';
            stepDiv.style.animationDelay = `${delaySec}s`;
            if (highlight) {
                stepDiv.style.borderLeftColor = 'var(--accent-cyan)';
                stepDiv.style.backgroundColor = 'rgba(6, 182, 212, 0.1)';
            }

            stepDiv.innerHTML = `
                <div class="step-title">${title}</div>
                <div class="math-display" id="${id}"></div>
            `;
            container.appendChild(stepDiv);
            formatMath(id, latex);
        }
    </script>
</body>
</html>
